<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seu fretado Cimed</title>
<meta name="robots" content="noindex">
<style>
/* sempre claro, como a plataforma (pedido da Josianny, 21/10/2026) */
:root{color-scheme:light;--am:#FFC600;--sobre-am:#16140C;--bg:#F8F6F1;--sup:#FFFFFF;--sup2:#F3F0E8;--linha:#ECE7DA;--tx:#1D1B16;--tx2:#4A463C;--mudo:#7A7568;--ok:#1E6B45;--ok-bg:#E3F2E9;--info:#1F4E8C;--info-bg:#E2ECF8;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
header{background:var(--sup);border-bottom:1px solid var(--linha);padding:14px 16px 16px;box-shadow:0 1px 2px rgba(29,27,22,.04)}
header .in,main{max-width:760px;margin:0 auto}
header .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:44px;width:auto;display:block}
header h1{margin:0;font-size:22px;line-height:1.2}
header p{margin:2px 0 0;color:var(--mudo);font-size:14px}
.faixa{height:6px;background:var(--am)}
main{padding:16px}
.caixa{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:16px;margin:0 0 14px}
h2{font-size:18px;margin:0 0 6px}
.apoio{color:var(--mudo);font-size:14px}
.busca{display:flex;gap:8px;flex-wrap:wrap}
.busca input{flex:1;min-width:0;min-height:46px;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font:inherit;background:var(--sup2);color:var(--tx)}
button,.bt{min-height:44px;border:1px solid var(--linha);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;background:var(--sup);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pri{background:var(--am);color:var(--sobre-am);border-color:var(--am)}
.ponto{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--linha)}
.ponto:first-child{border-top:0}
.hora{font-weight:700;font-variant-numeric:tabular-nums}
.ref{font-weight:600}
.end{color:var(--mudo);font-size:13.5px;overflow-wrap:anywhere}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acoes a{min-height:36px;padding:6px 10px;font-size:13.5px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--info-bg);color:var(--info)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.dist{font-size:12.5px;font-weight:700;color:var(--ok);margin-top:2px}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.vazio{color:var(--mudo);padding:8px 0}
</style>
</head>
<body>
<div class="faixa"></div>
<header><div class="in"><img src="logo-cimed.png" width="117" height="44" alt="Cimed"><div><h1>Seu fretado</h1><p>Itinerário e ponto mais perto de você</p></div></div></header>
<main id="m"><div class="caixa">Carregando o itinerário…</div></main>
<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const titulo = (s) => String(s || '').toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Da|De|Do|Das|Dos|E)\b/g, (w) => w.toLowerCase());
const mapa = (end) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(end);
const rota = (end) => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(end);
// só os códigos curtos dos itinerários vêm no link (nada que identifique a pessoa)
const cods = (new URLSearchParams(location.search).get('i') || '').split(',').map((x) => x.trim()).filter((x) => /^[0-9a-f]{8}$/.test(x)).slice(0, 4);
let ITINS = [];
// distância em linha reta (fórmula de haversine), em metros
function distancia(a, b) {
  const R = 6371000, rad = (x) => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = (m) => (m < 50 ? 'menos de 50 m' : m < 1000 ? '~' + (Math.round(m / 10) * 10) + ' m' : '~' + (m / 1000).toFixed(1).replace('.', ',') + ' km');
const temEscolhido = () => ITINS.some((i) => i.escolhido);
const comCoord = () => ITINS.some((i) => (i.pontos || []).some((p) => typeof p.lat === 'number'));
// área dos pontos do turno: a busca no mapa fica restrita à região do fretado
function caixaPontos() {
  let n = 90, s = -90, l = -180, o = 180;
  ITINS.forEach((i) => (i.pontos || []).forEach((p) => { if (typeof p.lat !== 'number') return; n = Math.min(n, p.lat); s = Math.max(s, p.lat); o = Math.min(o, p.lon); l = Math.max(l, p.lon); }));
  return n > s ? null : [o - 0.08, s + 0.08, l + 0.08, n - 0.08];
}
// endereço → coordenadas pelo OpenStreetMap (só a rua e o bairro; o número da casa não vai)
async function localizar(q) {
  // texto livre ou por partes ({ street, city, state }): o bairro do Correios nem sempre é o do mapa
  const cx = caixaPontos(); const ps = new URLSearchParams(typeof q === 'string' ? { q } : Object.assign({ country: 'Brasil' }, q));
  ps.set('format', 'json'); ps.set('limit', '1'); ps.set('countrycodes', 'br');
  if (cx) { ps.set('viewbox', cx.join(',')); ps.set('bounded', '1'); }
  const r = await fetch('https://nominatim.openstreetmap.org/search?' + ps.toString(), { headers: { 'Accept-Language': 'pt-BR' } }).then((x) => x.json());
  return r && r[0] ? { lat: +r[0].lat, lon: +r[0].lon } : null;
}
// raio da busca: só pontos a até 500 m (pedido da Josianny, 21/10/2026)
const RAIO_M = 500;
function porDistancia(origem, rotulo, termos) {
  const out = $('#res'); const todos = [];
  ITINS.forEach((i) => (i.pontos || []).forEach((p) => { if (typeof p.lat === 'number') todos.push({ p, i, d: distancia(origem, p) }); }));
  todos.sort((a, b) => a.d - b.d);
  // um cartão por endereço, com todas as linhas que param ali
  const grupos = new Map();
  for (const x of todos) {
    const k = norm(x.p.endereco || x.p.referencia);
    if (!grupos.has(k)) grupos.set(k, { p: x.p, d: x.d, itins: [], horas: [] });
    const g = grupos.get(k); if (!g.itins.includes(x.i)) { g.itins.push(x.i); g.horas.push(x.p.horario || ''); }
  }
  const todosG = [...grupos.values()];
  // o CEP não traz o número da casa: o mapa devolve um ponto qualquer da rua, que pode ser longa.
  // Ponto na mesma rua entra sempre, marcado "na sua rua" (CEP 37552-475, 22/10/2026)
  const rua = termos && termos.rua && termos.rua.length >= 4 ? termos.rua : '';
  // só o trecho da rua no endereço (antes do " - bairro"): "Rua São João" não casa com o bairro Jardim São João
  const naRua = (g) => !!rua && norm(String(g.p.endereco || '').split(' - ')[0]).includes(rua);
  const perto = todosG.filter((g) => g.d <= RAIO_M || naRua(g)).slice(0, 15);
  const qtdRua = perto.filter(naRua).length;
  // nada no raio: mostra os 3 mais próximos, avisando a distância
  const alem = perto.length ? [] : todosG.slice(0, 3);
  const vistos = new Set(grupos.keys());
  // pontos que o mapa não localizou, mas que combinam com a rua ou o bairro digitado
  const semCoord = [];
  // pelo CEP, só combinação forte (mesma rua ou mesmo bairro); palavra solta do bairro trazia ponto sem relação
  const minimo = rua ? 6 : 1;
  if (termos) ITINS.forEach((i) => (i.pontos || []).forEach((p) => { if (typeof p.lat === 'number') return; const s = pontuar(p, termos); const k = norm(p.endereco || p.referencia); if (s >= minimo && !vistos.has(k)) { vistos.add(k); semCoord.push({ p, i, s }); } }));
  semCoord.sort((a, b) => b.s - a.s);
  const cartaoG = (g) => g.itins.length === 1
    ? cartaoPonto(naRua(g) ? Object.assign({}, g.p, { naRua: true }) : g.p, titulo(g.itins[0].linha), temEscolhido() && !g.itins[0].escolhido, g.d)
    : cartaoPonto(Object.assign({}, g.p, { horario: '', naRua: naRua(g) }), g.itins.map((i, n) => titulo(i.linha) + (g.horas[n] ? ' ' + g.horas[n] : '')).join(' · '), temEscolhido() && !g.itins.some((i) => i.escolhido), g.d);
  const rot = rotulo ? esc(rotulo) + ': ' : '';
  let h = '';
  if (perto.length) h = `<p class="apoio">${rot}${perto.length === 1 ? 'o ponto' : perto.length + ' pontos'} do fretado ${qtdRua ? (qtdRua === perto.length ? 'na sua rua' : 'na sua rua e a até ' + RAIO_M + ' m') : 'a até ' + RAIO_M + ' m'}, do mais perto para o mais longe (distância em linha reta${qtdRua ? '; sem o número da casa, a distância na mesma rua é aproximada' : ''}). Use "Como chegar daqui" para ver o caminho a pé.</p>` + perto.map(cartaoG).join('');
  else if (alem.length) h = `<div class="vazio">${rot}nenhum ponto do fretado a até ${RAIO_M} m. Os mais próximos:</div>` + alem.map(cartaoG).join('');
  if (semCoord.length) h += '<p class="apoio" style="margin-top:12px">Também combinam com o que você digitou (sem distância calculada):</p>' + semCoord.slice(0, 5).map((x) => cartaoPonto(x.p, titulo(x.i.linha), temEscolhido() && !x.i.escolhido)).join('');
  out.innerHTML = h || '<div class="vazio">Não consegui calcular a distância. Digite o nome do seu bairro.</div>';
}

function cartaoPonto(p, linha, outra, dist) {
  const end = String(p.endereco || '').replace(/, Brasil$/, '').replace(/,(\s*,)+/g, ',');
  return `<div class="ponto"><div class="hora">${esc(p.horario || '')}${dist != null ? `<div class="dist">${p.naRua ? 'na sua rua' : p.aprox ? fmtDist(Math.max(100, Math.ceil(dist / 100) * 100)) + ' <span style="font-weight:400;color:var(--mudo)">(aprox.)</span>' : fmtDist(dist)}</div>` : ''}</div><div><div class="ref">${esc(p.referencia || end)}${linha ? ` <span class="chip">${esc(linha)}${outra ? ' · outra linha do turno' : ''}</span>` : ''}</div>${p.bairro ? `<div class="apoio">${esc(p.bairro)}${p.cidade ? ' · ' + esc(p.cidade) : ''}</div>` : ''}${end ? `<div class="end">${esc(end)}</div><div class="acoes"><a class="bt" href="${esc(mapa(end))}" target="_blank" rel="noopener">Ver no mapa</a><a class="bt" href="${esc(rota(end))}" target="_blank" rel="noopener">Como chegar daqui</a></div>` : ''}</div></div>`;
}
function itinerario(i, aberto) {
  const ps = Array.isArray(i.pontos) ? i.pontos : [];
  return `<details class="caixa" ${aberto ? 'open' : ''}><summary>${esc(titulo(i.linha))} · ${esc(String(i.turno || '').toLowerCase())} · chega ${esc(i.chegada || '—')}</summary>
    <p class="apoio" style="margin:4px 0 8px">${ps.length} pontos de embarque, na ordem do trajeto. Chegue alguns minutos antes do horário.</p>
    ${ps.map((p) => cartaoPonto(p)).join('')}</details>`;
}
const VAZIAS = new Set(['rua', 'avenida', 'av', 'travessa', 'tv', 'alameda', 'praca', 'rodovia', 'estrada', 'bairro', 'numero', 'casa', 'perto', 'proximo', 'de', 'da', 'do', 'das', 'dos', 'em', 'no', 'na', 'mg', 'pouso', 'alegre']);
const palavrasDe = (s) => norm(s).split(' ').filter((w) => w.length >= 3 && !VAZIAS.has(w) && !/^\d+$/.test(w));
function pontuar(p, t) {
  const b = norm(p.bairro), e = norm(p.endereco + ' ' + p.referencia), c = norm(p.cidade);
  let s = 0;
  if (t.bairro && b && b === t.bairro) s += 6;
  if (t.bairro && b && (b.includes(t.bairro) || t.bairro.includes(b))) s += 3;
  if (t.rua && t.rua.length >= 4 && e.includes(t.rua)) s += 8;
  (t.palavras || []).forEach((w) => { if (b.split(' ').includes(w)) s += 4; else if (b.includes(w)) s += 3; else if (e.split(' ').includes(w)) s += 2; });
  if (s > 0 && t.cidade && c && c === t.cidade) s += 1;
  return s;
}
async function buscar(txt) {
  const out = $('#res'); const dig = txt.replace(/\D/g, '');
  let t = { palavras: palavrasDe(txt) };
  if (dig.length === 8) {
    out.innerHTML = '<div class="vazio">Consultando o CEP…</div>';
    try {
      const r = await fetch(`https://viacep.com.br/ws/${dig}/json/`).then((x) => x.json());
      if (r && !r.erro && !r.logradouro && !r.bairro) { out.innerHTML = '<div class="vazio">Esse CEP é da cidade inteira (' + esc(r.localidade || '') + '), sem rua nem bairro. Digite o nome da sua rua ou do seu bairro.</div>'; return; }
      if (r && !r.erro) {
        t = { rua: norm(String(r.logradouro || '').replace(/^(rua|avenida|av|travessa|alameda|praca|rodovia)\s+/i, '')), bairro: norm(r.bairro), cidade: norm(r.localidade), palavras: palavrasDe(r.logradouro + ' ' + r.bairro) };
        out.dataset.local = [r.logradouro, r.bairro, r.localidade].filter(Boolean).join(', ');
        if (comCoord()) {
          out.innerHTML = '<div class="vazio">Calculando as distâncias…</div>';
          try {
            // 1º a rua pelas partes; 2º a rua em texto, sem o bairro; 3º só o bairro (aproximado)
            let o = r.logradouro ? await localizar({ street: r.logradouro, city: r.localidade, state: r.uf }) : null;
            if (!o && r.logradouro) o = await localizar([r.logradouro, r.localidade, r.uf].filter(Boolean).join(', '));
            if (o) { porDistancia(o, 'Perto de ' + out.dataset.local, t); return; }
            o = r.bairro ? await localizar([r.bairro, r.localidade, r.uf].filter(Boolean).join(', ')) : null;
            if (o) { porDistancia(o, 'Perto do bairro ' + r.bairro + ' (o mapa não achou a rua; distância aproximada pelo centro do bairro)', t); return; }
          } catch (e) { /* sem mapa: segue pela busca por nome */ }
        }
      } else { out.innerHTML = '<div class="vazio">' + (dig.endsWith('000') ? 'Esse CEP é da cidade inteira, sem rua nem bairro.' : 'CEP não encontrado.') + ' Digite o nome da sua rua ou do seu bairro, ou use a sua localização.</div>'; return; }
    } catch (e) { out.innerHTML = '<div class="vazio">Não consegui consultar o CEP agora. Tente digitar o nome da rua ou do bairro.</div>'; return; }
  } else {
    out.dataset.local = '';
    if (comCoord()) {
      out.innerHTML = '<div class="vazio">Calculando as distâncias…</div>';
      // só rua e bairro vão para o mapa: o número da casa fica no celular
      const semNumero = txt.replace(/\b\d+[a-zA-Z]?\b/g, ' ').replace(/\s+/g, ' ').trim();
      try { const o = semNumero.length >= 3 ? await localizar(semNumero) : null; if (o) { porDistancia(o, 'Perto de ' + semNumero, t); return; } } catch (e) { /* segue pela busca por nome */ }
    }
  }
  const todos = [];
  ITINS.forEach((i) => (i.pontos || []).forEach((p) => todos.push({ p, i, s: pontuar(p, t) })));
  const achados = todos.filter((x) => x.s > 0).sort((a, b) => b.s - a.s || Number(b.i.escolhido) - Number(a.i.escolhido)).slice(0, 8);
  out.innerHTML = achados.length
    ? `<p class="apoio">${out.dataset.local ? 'Perto de ' + esc(out.dataset.local) + ': ' : ''}os pontos que mais combinam com o que você digitou. Use "Como chegar daqui" para ver a distância a pé.</p>` + achados.map((x) => cartaoPonto(x.p, titulo(x.i.linha), temEscolhido() && !x.i.escolhido)).join('')
    : `<div class="vazio">Nenhum ponto do seu turno com esse nome de rua ou bairro. Bairros atendidos no seu turno: ${esc(bairrosAtendidos().join(', '))}. Digite o mais perto de você, ou veja a lista completa abaixo.</div>`;
}
function bairrosAtendidos() {
  const m = new Map();
  ITINS.forEach((i) => (i.pontos || []).forEach((p) => { const b = String(p.bairro || '').trim(); if (b && !m.has(norm(b))) m.set(norm(b), titulo(b)); }));
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
async function rpc(nome, corpo) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, { method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo || {}) });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
const UNI_NOME = { 'UNIDADE 1': 'Unidade 1 · Pouso Alegre (Site I)', 'UNIDADE 2': 'Unidade 2 · Fernão Dias (Site II)', 'SSBV': 'SSBV · São Sebastião da Bela Vista' };
const ORDEM_TURNO = ['1º TURNO', '2º TURNO', '3º TURNO SEG-SAB', '3º TURNO DOM', 'ADMINISTRATIVO', '2X2X3 - 1º TURNO', '2X2X3 - 2º TURNO', 'APRENDIZ'];
const TURNO_NOME = (x) => ({ '1º TURNO': '1º turno', '2º TURNO': '2º turno', '3º TURNO SEG-SAB': '3º turno (segunda a sábado)', '3º TURNO DOM': '3º turno (domingo)', 'ADMINISTRATIVO': 'Administrativo', '2X2X3 - 1º TURNO': 'Escala 2x2x3 · dia', '2X2X3 - 2º TURNO': 'Escala 2x2x3 · noite', 'APRENDIZ': 'Aprendiz' })[x] || x;
// caixa da busca (mesma nos dois modos)
function caixaBusca() {
  return `<div class="caixa"><h2>Ache o ponto mais perto de você</h2><p class="apoio" style="margin-top:0">Digite o CEP da sua rua (com ou sem traço), ou o nome da rua ou do bairro, por exemplo "São Geraldo" ou "Avenida Ayrton Senna". O CEP é consultado no ViaCEP e a rua é localizada no mapa do OpenStreetMap (serviços públicos), só para calcular a distância; nada do que você digita fica guardado.</p>
    <form class="busca" id="fBusca"><input id="q" inputmode="text" autocomplete="postal-code" placeholder="CEP da sua rua, nome da rua ou do bairro" aria-label="CEP, rua ou bairro"><button class="pri" type="submit">Buscar</button></form>${comCoord() && navigator.geolocation ? '<button type="button" id="btGps" style="margin-top:8px">Usar minha localização</button>' : ''}<div id="res" style="margin-top:10px"></div></div>`;
}
function ligarBusca() {
  $('#fBusca').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#q').value.trim(); if (v.length >= 3) buscar(v); });
  $('#btGps')?.addEventListener('click', () => {
    $('#res').innerHTML = '<div class="vazio">Pegando a sua localização (o celular pede permissão)…</div>';
    navigator.geolocation.getCurrentPosition((pos) => porDistancia({ lat: pos.coords.latitude, lon: pos.coords.longitude }, 'Perto de onde você está'),
      () => { $('#res').innerHTML = '<div class="vazio">Não consegui a sua localização. Digite o CEP ou o nome do bairro.</div>'; }, { enableHighAccuracy: true, timeout: 15000 });
  });
}
// link do e-mail: o itinerário da pessoa em destaque
async function modoPessoal(m) {
  try {
    // teste local (teste/): os dados chegam prontos, sem consultar o banco
    ITINS = Array.isArray(window.FRETADO_DADOS) ? window.FRETADO_DADOS : await rpc('fretado_publico', { p_codigos: cods });
  } catch (e) { m.innerHTML = '<div class="caixa">Não consegui carregar o itinerário agora. Tente de novo em alguns minutos.</div>'; return; }
  const meus = ITINS.filter((i) => i.escolhido);
  if (!meus.length) { m.innerHTML = '<div class="caixa">Este itinerário não está mais disponível. Fale com o Time de Admissão.</div>'; return; }
  const outros = ITINS.filter((i) => !i.escolhido);
  m.innerHTML = caixaBusca() + `
    <h2 style="margin:18px 0 8px">Seu itinerário</h2>
    ${meus.map((i) => itinerario(i, meus.length === 1)).join('')}
    ${outros.length ? `<details class="caixa"><summary>Outras linhas do mesmo turno (${outros.length})</summary><p class="apoio">Se outro ponto ficar mais perto, avise o Time de Admissão para trocar a sua linha.</p>${outros.map((i) => itinerario(i, false)).join('')}</details>` : ''}
    <p class="apoio">No primeiro dia, o convite da integração vale como passe no fretado.</p>`;
  ligarBusca();
}
// link geral: o candidato escolhe a unidade e o turno e vê todas as linhas
const estiloSel = 'flex:1;min-height:46px;border:1px solid var(--linha);border-radius:10px;padding:8px;font:inherit;background:var(--sup2);color:var(--tx)';
async function modoGeral(m) {
  let turnos;
  try { turnos = Array.isArray(window.FRETADO_TURNOS) ? window.FRETADO_TURNOS : await rpc('fretado_publico_turnos'); }
  catch (e) { m.innerHTML = '<div class="caixa">Não consegui carregar as linhas agora. Tente de novo em alguns minutos.</div>'; return; }
  const pos = (lista, x) => { const k = lista.indexOf(x); return k < 0 ? 99 : k; };
  const unis = [...new Set(turnos.map((x) => x.unidade))].sort((a, b) => pos(Object.keys(UNI_NOME), a) - pos(Object.keys(UNI_NOME), b) || a.localeCompare(b));
  turnos = turnos.slice().sort((a, b) => pos(ORDEM_TURNO, a.turno) - pos(ORDEM_TURNO, b.turno) || a.turno.localeCompare(b.turno));
  const ps = new URLSearchParams(location.hash.slice(1));
  const uni = unis.includes(ps.get('u')) ? ps.get('u') : '';
  m.innerHTML = `<div class="caixa"><h2>Qual é a sua unidade e o seu turno?</h2><p class="apoio" style="margin-top:0">Escolha para ver as linhas do fretado e achar o ponto mais perto da sua casa.</p>
    <div class="busca" style="margin-bottom:8px"><select id="selU" aria-label="Unidade" style="${estiloSel}"><option value="">Unidade</option>${unis.map((u) => `<option value="${esc(u)}" ${u === uni ? 'selected' : ''}>${esc(UNI_NOME[u] || u)}</option>`).join('')}</select></div>
    <div class="busca"><select id="selT" aria-label="Turno" style="${estiloSel}"></select></div></div><div id="area"></div>`;
  const preencherTurnos = () => {
    const u = $('#selU').value; const ts = turnos.filter((x) => x.unidade === u);
    $('#selT').innerHTML = '<option value="">' + (u ? 'Turno' : 'Escolha a unidade primeiro') + '</option>' + ts.map((x) => `<option value="${esc(x.turno)}" ${x.turno === ps.get('t') ? 'selected' : ''}>${esc(TURNO_NOME(x.turno))} · ${x.linhas} linha${x.linhas === 1 ? '' : 's'}</option>`).join('');
  };
  const carregar = async () => {
    const u = $('#selU').value, tu = $('#selT').value; const area = $('#area');
    if (!u || !tu) { area.innerHTML = ''; return; }
    history.replaceState(null, '', location.pathname + location.search + '#u=' + encodeURIComponent(u) + '&t=' + encodeURIComponent(tu));
    area.innerHTML = '<div class="caixa">Carregando as linhas…</div>';
    try { ITINS = Array.isArray(window.FRETADO_DADOS) ? window.FRETADO_DADOS.filter((i) => i.unidade === u && i.turno === tu).map((i) => Object.assign({}, i, { escolhido: false })) : await rpc('fretado_publico_turno', { p_unidade: u, p_turno: tu }); }
    catch (e) { area.innerHTML = '<div class="caixa">Não consegui carregar as linhas agora.</div>'; return; }
    area.innerHTML = caixaBusca() + `<h2 style="margin:18px 0 8px">Linhas do ${esc(TURNO_NOME(tu).toLowerCase())} · ${ITINS.length}</h2>${ITINS.map((i) => itinerario(i, false)).join('')}
      <p class="apoio">Achou o seu ponto? Conte à sua recrutadora qual é a linha, para ela registrar no seu cadastro.</p>`;
    ligarBusca();
  };
  $('#selU').addEventListener('change', () => { preencherTurnos(); carregar(); });
  $('#selT').addEventListener('change', carregar);
  preencherTurnos(); if (uni && ps.get('t')) carregar();
}
function iniciar() { const m = $('#m'); if (cods.length) modoPessoal(m); else modoGeral(m); }
iniciar();
</script>
